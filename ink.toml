name = "Atlas"
package = "com.atlas"
version = "2.0.0"
version_code = 58
# Row images need native decoding; Ink's detection misses them with preserved symlinks.
# App icons on Open apps are managed files, which need "files". It adds no permissions.
capabilities = ["image", "files"]

[signing]
keystore = "signing/atlas.keystore"
key_alias = "atlas"
